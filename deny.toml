[licenses]
# Futhark ships under Apache-2.0. Copyleft is denied by omission, deliberately:
# the ebook tooling ecosystem is full of GPL code (calibre, its plugins, libmobi)
# and accidental linkage would be a licensing problem, not a style problem.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"          # no `version = "*"` reaching a real build

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
