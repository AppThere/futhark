#
# ADR-F026: every fuzz target ships with a seed proving the harness reaches the
# parser. `check-fuzz-seeds` reads this file, runs the replay, and requires the
# named panic.

[[target]]
name = "parse_fixture"
seed = "known-crash"
panics_with = "length prefix exceeds buffer"
replay = "replay"
